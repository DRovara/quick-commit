name: Publish to PyPI

on:
  # Trigger when a tag that starts with "v" is pushed.
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    # Required for trusted publishing: lets the job mint an OIDC token for PyPI.
    permissions:
      id-token: write

    steps:
      # Check out the repository code.
      - name: Check out repository
        uses: actions/checkout@v4

      # Set up the desired Python version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Upgrade pip and install build tools.
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Build your package (this creates the distributions under the "dist" folder).
      - name: Build package
        run: |
          python -m build

      # Publish the package to PyPI via trusted publishing (no API token needed).
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
